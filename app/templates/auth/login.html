<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login | LedgerFlow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="login-page-body">

<div class="bg-particles">
    <span style="--i:11;"></span>
    <span style="--i:16;"></span>
    <span style="--i:22;"></span>
    <span style="--i:13;"></span>
    <span style="--i:18;"></span>
    <span style="--i:26;"></span>
    <span style="--i:15;"></span>
    <span style="--i:21;"></span>
    <span style="--i:12;"></span>
    <span style="--i:19;"></span>
    <span style="--i:25;"></span>
    <span style="--i:14;"></span>
</div>

<div class="ambient-glow glow-one"></div>
<div class="ambient-glow glow-two"></div>
<div class="ambient-glow glow-three"></div>

<div class="login-shell">
    <div class="login-card login-card-premium">
        <div class="login-brand">
            <div class="brand-logo-wrap">
                <img src="{{ url_for('static', filename='img/logo.png') }}"
                     alt="Logo LedgerFlow"
                     class="brand-logo"
                     onerror="this.style.display='none'; this.parentElement.classList.add('no-logo');">
                <span class="brand-logo-fallback">L</span>
            </div>

            <div>
                <h1>LedgerFlow</h1>
                <p>Acceso al sistema</p>
            </div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-stack mb-3">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} custom-alert">
                            <i class="fa-solid fa-circle-info"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Usuario o correo</label>
                <input type="text" name="login" class="form-control" placeholder="Ej. verde1 o correo@dominio.com" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="btn btn-success w-100">
                <i class="fa-solid fa-right-to-bracket"></i>
                Entrar
            </button>
        </form>
    </div>
</div>

</body>
</html>
